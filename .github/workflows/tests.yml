name: Tests and installed package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install GNU gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m build
      - name: Install and exercise wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/l10n-installed"
          "$RUNNER_TEMP/l10n-installed/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/l10n-installed/bin/l10n-lint" --version
          "$RUNNER_TEMP/l10n-installed/bin/python" "$GITHUB_WORKSPACE/tests/installed_smoke.py"
  gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - run: xvfb-run -a /usr/bin/python3 tests/gtk_smoke.py
