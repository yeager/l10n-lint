[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "l10n-lint"
version = "1.20.0"
description = "Linter for localization files (.po, .ts)"
license = "GPL-3.0-or-later"
authors = [
    {name = "Daniel Nylander", email = "daniel@danielnylander.se"},
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Localization",
    "Environment :: Console",
]

[project.optional-dependencies]
gtk = ["PyGObject>=3.42"]

[project.scripts]
l10n-lint = "l10n_lint:main"
l10n-lint-gtk = "l10n_lint_gtk:main"

[project.urls]
Homepage = "https://github.com/yeager/l10n-lint"

[tool.setuptools]
py-modules = ["l10n_lint", "l10n_lint_gtk"]

[tool.setuptools.package-data]
"*" = ["locale/**/*", "man/**/*", "docs/**/*"]
