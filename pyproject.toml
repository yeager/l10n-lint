[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "l10n-lint"
version = "1.20.1"
description = "Linter for localization files (.po, .ts)"
license = "GPL-3.0-or-later"
authors = [
    {name = "Daniel Nylander", email = "daniel@danielnylander.se"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tomli>=2.0; python_version < '3.11'"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Localization",
    "Environment :: Console",
]

[project.optional-dependencies]
gtk = ["PyGObject>=3.42"]
test = ["pytest>=7", "build>=1"]

[project.scripts]
l10n-lint = "l10n_lint:main"
l10n-lint-gtk = "l10n_lint_gtk:main"

[project.urls]
Homepage = "https://github.com/yeager/l10n-lint"

[tool.setuptools]
py-modules = ["l10n_lint", "l10n_lint_gtk", "l10n_project", "print_helper"]

[tool.setuptools.package-data]
"*" = ["locale/**/*", "man/**/*", "docs/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
