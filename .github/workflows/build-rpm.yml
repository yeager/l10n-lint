name: Build RPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y rpm gettext

      - name: Get version
        id: version
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' l10n_lint.py)" >> $GITHUB_OUTPUT

      - name: Compile translations
        run: |
          for po in po/*.po; do
            [ -f "$po" ] || continue
            lang=$(basename "$po" .po)
            mkdir -p locale/$lang/LC_MESSAGES
            msgfmt -o locale/$lang/LC_MESSAGES/l10n-lint.mo "$po"
          done

      - name: Build RPM
        run: |
          VER=${{ steps.version.outputs.version }}
          DATE=$(date "+%a %b %d %Y")
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Create tarball
          PKG=l10n-lint-$VER
          mkdir -p $PKG
          cp l10n_lint.py l10n_lint_gtk.py $PKG/ 2>/dev/null || cp l10n_lint.py $PKG/
          cp -r locale $PKG/
          cp -r man $PKG/ 2>/dev/null || true
          cp io.github.yeager.l10n-lint.desktop $PKG/ 2>/dev/null || true
          cp io.github.yeager.l10n-lint.metainfo.xml $PKG/ 2>/dev/null || true
          cp -r data/icons $PKG/ 2>/dev/null || true
          tar czf ~/rpmbuild/SOURCES/l10n-lint-$VER.tar.gz $PKG

          # Write spec
          cat > ~/rpmbuild/SPECS/l10n-lint.spec << SPECEOF
          Name:           l10n-lint
          Version:        $VER
          Release:        1
          Summary:        Linter for localization files
          License:        GPL-3.0-or-later
          URL:            https://github.com/yeager/l10n-lint
          Source0:        l10n-lint-$VER.tar.gz
          BuildArch:      noarch
          Requires:       python3 >= 3.9
          
          %description
          l10n-lint checks .po and .ts localization files for common issues.
          
          %prep
          %setup -q
          
          %install
          mkdir -p \$RPM_BUILD_ROOT/usr/bin
          mkdir -p \$RPM_BUILD_ROOT/usr/share/l10n-lint/locale
          mkdir -p \$RPM_BUILD_ROOT/usr/share/applications
          mkdir -p \$RPM_BUILD_ROOT/usr/share/metainfo
          mkdir -p \$RPM_BUILD_ROOT/usr/share/icons/hicolor/scalable/apps
          mkdir -p \$RPM_BUILD_ROOT/usr/share/man/man1
          install -m 755 l10n_lint.py \$RPM_BUILD_ROOT/usr/bin/l10n-lint
          test -f l10n_lint_gtk.py && cp l10n_lint_gtk.py \$RPM_BUILD_ROOT/usr/share/l10n-lint/ || true
          cp -r locale/* \$RPM_BUILD_ROOT/usr/share/l10n-lint/locale/
          test -f io.github.yeager.l10n-lint.desktop && install -m 644 io.github.yeager.l10n-lint.desktop \$RPM_BUILD_ROOT/usr/share/applications/ || true
          test -f io.github.yeager.l10n-lint.metainfo.xml && install -m 644 io.github.yeager.l10n-lint.metainfo.xml \$RPM_BUILD_ROOT/usr/share/metainfo/ || true
          test -f icons/hicolor/scalable/apps/io.github.yeager.l10n-lint-gtk.svg && install -m 644 icons/hicolor/scalable/apps/io.github.yeager.l10n-lint-gtk.svg \$RPM_BUILD_ROOT/usr/share/icons/hicolor/scalable/apps/ || true
          test -f man/en/l10n-lint.1 && install -m 644 man/en/l10n-lint.1 \$RPM_BUILD_ROOT/usr/share/man/man1/ || true
          
          %files
          /usr/bin/l10n-lint
          /usr/share/l10n-lint/
          /usr/share/applications/*.desktop
          /usr/share/metainfo/*.xml
          /usr/share/icons/hicolor/scalable/apps/*.svg
          /usr/share/man/man1/l10n-lint.1*
          
          %changelog
          * $DATE Daniel Nylander <daniel@danielnylander.se> - $VER-1
          - Fix About dialog, compile translations
          SPECEOF

          # Remove leading whitespace from spec (heredoc was indented)
          sed -i 's/^          //' ~/rpmbuild/SPECS/l10n-lint.spec

          rpmbuild -ba ~/rpmbuild/SPECS/l10n-lint.spec

      - name: Upload RPM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.event.release.tag_name || github.ref_name }}
          RPM=$(find ~/rpmbuild/RPMS -name "*.rpm" | head -1)
          [ -f "$RPM" ] && gh release upload "$TAG" "$RPM" --clobber || echo "No RPM found"
